# Front web server for the Laravel API: forwards every request to PHP-FPM in `laravel-api`.
# Replaces the upstream `practice-software-testing-web` image, which is published for arm64 only
# and cannot start on x86 CI runners.
server {
    listen 80;
    server_tokens off;
    root /var/www/public; # path inside the laravel-api container

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
