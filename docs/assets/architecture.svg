<title id="architecture-title">QA Automation Showcase architecture</title>
<desc id="architecture-desc">GitHub Actions runs a Playwright UI suite and a RestAssured API suite against Toolshop; the UI suite sets up its test data through the Toolshop API, and reports are published to GitHub Pages.</desc>
